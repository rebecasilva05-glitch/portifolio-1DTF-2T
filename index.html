<!DOCTYPE html> <!-- 0 doctype indica qual a linguagem de programaçao que esta sendo usada, neste caso o HTML-->
<html lang="pt-br"> <!-- inicio do codigo-->

<head> <!-- inico do cabeçalho do documento. Dentro dessa tag pode ser inseridas folhas de estelo e escripts-->
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--fornece os metadados da sua pagina para o navegador-->
    <title>portifolio</title> <!--titulo do projeto-->
</head> <!--fim do cabesalho do documento-->
