<html lang="pt-br"> <!-- inicio do codigo-->
<head> <!-- inico do cabeçalho do documento. Dentro dessa tag pode ser inseridas folhas de estelo e escripts-->
    <meta charset="UTF-8"> <!-- indica quais serao os caracteres {character set ou charset} sera utilizado para renderizar o texto da pagina. O UTF-8 indentifica os caracteres da lingua portuguesa.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

</body>
</html>
